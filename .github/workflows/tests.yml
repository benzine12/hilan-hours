name: tests

on:
  push:
  pull_request:

# Read the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The widget tests run the Scriptable script itself under Node.
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  # What pipx installs is the wheel, not this checkout: build it, install it
  # somewhere else, and run it from a directory with no source in it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: The source archive carries the tests and the widget
        run: |
          tar tzf dist/*.tar.gz | grep -q "tests/test_calc.py"
          tar tzf dist/*.tar.gz | grep -q "ios/HilanWidget.js"
      - name: The wheel runs on its own
        run: |
          python -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/try/bin/hilan" --help
